# Tooling config only. Runtime dependencies live in requirements.txt (per the
# architecture doc); this file is not a build/packaging manifest.

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
