# Cloud Run service (architecture doc §10). Scales to zero; secrets come from
# Secret Manager, never the image or the repo.
#
# One-time secrets:
#   gcloud secrets create anthropic-api-key --replication-policy=automatic
#   printf %s "$ANTHROPIC_API_KEY" | gcloud secrets versions add anthropic-api-key --data-file=-
#   gcloud secrets create redis-url --replication-policy=automatic
#   printf %s "$REDIS_URL"          | gcloud secrets versions add redis-url --data-file=-
#
# Deploy (build + push the image, set the two REPLACE_ values, then):
#   gcloud run services replace deploy/cloudrun.yaml --region us-west1
# or the imperative form:
#   gcloud run deploy analytics-agent --source . --region us-west1 \
#     --allow-unauthenticated --min-instances 0 --max-instances 3 \
#     --memory 512Mi --cpu 1 --concurrency 4 --timeout 120 \
#     --set-env-vars DEPLOY_MODE=deployed,ANALYST_MODEL=claude-haiku-4-5,MAX_AGENT_ITERS=6,\
# DEMO_ENABLED=true,RATE_LIMIT_PER_VISITOR_PER_DAY=5,GLOBAL_DAILY_QUESTION_CAP=300,\
# MONTHLY_BUDGET_USD=15,CORS_ALLOWED_ORIGIN=https://YOUR-PORTFOLIO-ORIGIN \
#     --set-secrets ANTHROPIC_API_KEY=anthropic-api-key:latest,REDIS_URL=redis-url:latest
#
# After deploying, warm the cache:  python -m deploy.warm_cache https://<service-url>

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: analytics-agent
  labels:
    project: analytics-agent
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"   # scale to zero when idle
        autoscaling.knative.dev/maxScale: "3"    # backstop; the app has its own caps
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 4
      timeoutSeconds: 120
      containers:
        - image: REPLACE_WITH_IMAGE   # e.g. us-west1-docker.pkg.dev/PROJECT/web/analytics-agent:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: DEPLOY_MODE
              value: deployed
            - name: ANALYST_MODEL
              value: claude-haiku-4-5
            - name: MAX_AGENT_ITERS
              value: "6"
            - name: DEMO_ENABLED
              value: "true"                        # flip to "false" = instant kill switch
            - name: RATE_LIMIT_PER_VISITOR_PER_DAY
              value: "5"
            - name: GLOBAL_DAILY_QUESTION_CAP
              value: "300"
            - name: MONTHLY_BUDGET_USD
              value: "15"
            - name: CORS_ALLOWED_ORIGIN
              value: REPLACE_WITH_PORTFOLIO_ORIGIN  # e.g. https://carlos.example.com
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api-key
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-url                  # Upstash rediss:// URL
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
  traffic:
    - percent: 100
      latestRevision: true
