# Human-readable column docs for the Seattle energy source.
#
# describe_schema (M4) serves this joined to SQLite introspection (PRAGMA
# table_info / sqlite_master), so the agent sees curated meanings, enum values,
# and known-null caveats — never the raw database. Names below are OUR schema
# names (post field_map); descriptions are adapted from the data.seattle.gov
# metadata for resource teqw-tu6e.

dataset:
  key: seattle_energy
  title: Seattle Building Energy Benchmarking, 2015-Present
  description: >
    Annual energy performance filings for Seattle non-residential and multifamily
    buildings over 20,000 sq ft, required under SMC 22.920. One row per building
    per calendar year. ~38k rows, ~3,900 buildings, data years 2015-2025.
  source_url: https://data.seattle.gov/resource/teqw-tu6e
  dialect_note: >
    SQLite everywhere (local and the deployed demo). Window functions and CTEs
    are available, plus registered aggregates median(x), mode(x), mean(x)
    alongside the built-in avg(x). The agent connects read-only (PRAGMA
    query_only).

tables:

  buildings:
    description: >
      One row per building (natural key ose_building_id). Attributes are treated
      as static; ingest keeps the most recent non-null value across years, so a
      building that changed primary use over time shows only its latest.
    columns:
      ose_building_id:       { type: text, pk: true, doc: "City benchmarking id (OSEBuildingID). Stored as text; values are integer-like." }
      building_name:         { type: text, doc: "Property name on record with the City." }
      building_type:         { type: text, doc: "City high-level class, e.g. NonResidential, Multifamily HR (10+ floors)." }
      primary_property_type: { type: text, doc: "EPA property type — the single use accounting for >50% of floor area (source: EPAPropertyType). Best column for 'what kind of building is this'." }
      tax_parcel_id:         { type: text, doc: "King County parcel PIN. Reserved for the future permits join; not used in v1 analysis." }
      address:               { type: text }
      city:                  { type: text, doc: "Almost always SEATTLE." }
      state:                 { type: text, doc: "Almost always WA." }
      zip_code:              { type: text }
      neighborhood:          { type: text, doc: "Dept. of Neighborhoods area, UPPERCASE, e.g. DOWNTOWN, BALLARD, EAST." }
      council_district:      { type: int, doc: "City council district 1-7 (boundaries as of the Nov 2023 election). Can be null." }
      year_built:            { type: int, doc: "Construction year. 0 or null for a few records." }
      number_of_floors:      { type: int, doc: "Occupiable floors at or above grade. Often null; unreliable for some records." }
      number_of_buildings:   { type: int, doc: "Buildings comprising the property (a campus can be >1)." }
      gfa_total:             { type: float, doc: "Gross floor area incl. parking, sq ft (PropertyGFATotal)." }
      gfa_parking:           { type: float, doc: "Parking floor area, sq ft. 0 when there is no enclosed parking." }
      latitude:              { type: float }
      longitude:             { type: float }

  energy_records:
    description: >
      One row per building per data year. Upsert key (ose_building_id,
      data_year). Energy/emissions columns are null for buildings that did not
      report usable data that year (non-compliant or exempt).
    columns:
      id:                      { type: int, pk: true, doc: "Surrogate key; not meaningful." }
      ose_building_id:         { type: text, fk: buildings.ose_building_id }
      data_year:               { type: int, doc: "Calendar year of the filing, 2015-2025." }
      site_eui:                { type: float, doc: "Site energy use intensity from utility bills, kBtu/sf (SiteEUI)." }
      site_eui_wn:             { type: float, doc: "Weather-normalized site EUI, kBtu/sf. Prefer this for year-over-year trend comparisons." }
      source_eui:              { type: float, doc: "Source EUI incl. generation/transmission losses, kBtu/sf." }
      source_eui_wn:           { type: float, doc: "Weather-normalized source EUI, kBtu/sf." }
      site_energy_use_kbtu:    { type: float, doc: "Total on-site energy consumed, kBtu (not per sf)." }
      energy_star_score:       { type: int, doc: "EPA 1-100 rating, 50 = national median. NULL BY DESIGN for property types ENERGY STAR does not score (e.g. many mixed-use, labs). Do not treat null as 0; filter it or add a has-score indicator." }
      electricity_kwh:         { type: float, doc: "Annual electricity, kWh (grid + on-site renewable)." }
      electricity_kbtu:        { type: float, doc: "Same electricity in kBtu (1 kWh = 3.412 kBtu)." }
      natural_gas_therms:      { type: float, doc: "Annual utility natural gas, therms." }
      natural_gas_kbtu:        { type: float, doc: "Same natural gas in kBtu." }
      steam_kbtu:              { type: float, doc: "Annual district steam, kBtu. Null/0 for most buildings; downtown steam-loop buildings only." }
      total_ghg_emissions:     { type: float, doc: "Total GHG emissions, metric tons CO2e." }
      ghg_emissions_intensity: { type: float, doc: "Emissions per gross floor area, kg CO2e/sf. The headline 'how dirty per sq ft' metric; basis for the model's is_high_emitter label." }
      compliance_status:       { type: text, enum: ["Compliant", "Not Compliant"], doc: "~93% Compliant." }
      compliance_issue:        { type: text, doc: "Free text, e.g. 'No Issue', 'Missing Data'. Mostly 'No Issue'." }
      demolished:              { type: int, doc: "1 if the property was demolished as of the 2023 reporting cycle, else 0. Exclude from current-stock analysis." }

# Folded into the system prompt (agent/prompts.py). facts/examples/values push
# the tools+system prefix over the Haiku cache floor AND stop the agent calling
# describe_schema on every run; rules carries the source-specific SQL guidance.
prompt:
  facts: |
    What's in the data (stable — no need to query to confirm):
    - 38,309 energy_records across 3,871 buildings, data years 2015 through 2025.
      Coverage grows over time: ~3,175 buildings reported in 2015, ~3,700 by 2024.
    - compliance_status is ~93% 'Compliant', ~7% 'Not Compliant'.
    - ~70 distinct primary_property_type values. The big ones by building count:
      Multifamily Housing (~1,970), Office (~500), Non-Refrigerated Warehouse (~160),
      Mixed Use Property (~160), K-12 School (~150), Hotel (~85).
    - energy_star_score is present for ~75% of records and the gap is structural,
      not random: types EPA does not rate (Laboratory, Data Center, Self-Storage,
      many Mixed Use) are mostly NULL; Multifamily / Hotel / Office / School are
      mostly populated. Never treat NULL as 0 — filter it.
    - energy/emissions columns (site_eui*, *ghg*, electricity_*, compliance_status,
      demolished, ...) are NULL for buildings that didn't report usable data a
      given year. Add "WHERE <col> IS NOT NULL" for aggregates.

    The predict tool's model (is_high_emitter): ROC-AUC ~0.86 on a temporal split
    but ~0.76 for a genuinely new building; strongest signals are building_age,
    primary_property_type, and floor area. Say the ~0.76 number when you cite it.
  examples: |
    Worked examples (patterns to copy — adjust columns/filters to the question):

    # "Which property types have the worst emissions intensity?"
    SELECT b.primary_property_type,
           COUNT(*) AS n,
           median(r.ghg_emissions_intensity) AS median_kgco2e_sf
    FROM energy_records r
    JOIN buildings b USING (ose_building_id)
    WHERE r.data_year = 2023 AND r.ghg_emissions_intensity IS NOT NULL
    GROUP BY 1
    HAVING n >= 20
    ORDER BY median_kgco2e_sf DESC
    LIMIT 10;

    # "Has 400 Pine St gotten more efficient since 2015?"  (weather-normalised EUI)
    SELECT r.data_year, r.site_eui_wn
    FROM energy_records r
    JOIN buildings b USING (ose_building_id)
    WHERE b.building_name LIKE '%Pine%' AND r.site_eui_wn IS NOT NULL
    ORDER BY r.data_year;

    # "How has office energy use changed over time?"  (trend -> good make_chart input)
    SELECT r.data_year, AVG(r.site_eui_wn) AS avg_site_eui_wn
    FROM energy_records r
    JOIN buildings b USING (ose_building_id)
    WHERE b.primary_property_type = 'Office' AND r.site_eui_wn IS NOT NULL
    GROUP BY 1
    ORDER BY 1;

    # "What share of filings are compliant?"
    SELECT compliance_status, COUNT(*) AS n,
           ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS pct
    FROM energy_records
    GROUP BY 1;

    # "What's the 90th-percentile site EUI for offices in 2024?"  (no PERCENTILE_CONT)
    WITH ranked AS (
      SELECT r.site_eui,
             ROW_NUMBER() OVER (ORDER BY r.site_eui) AS rn,
             COUNT(*) OVER () AS n
      FROM energy_records r
      JOIN buildings b USING (ose_building_id)
      WHERE b.primary_property_type = 'Office' AND r.data_year = 2024
            AND r.site_eui IS NOT NULL
    )
    SELECT site_eui AS p90_site_eui FROM ranked WHERE rn = CAST(0.9 * n AS INT);

    # predict-tool translation — "what would the model expect for a 1975 hotel,
    # ~150,000 sq ft, 8 floors, no ENERGY STAR score?"
    #   -> predict(records=[{
    #        "building_age": 51, "log_gfa_total": 5.18, "number_of_floors": 8,
    #        "has_energy_star": 0, "primary_property_type": "Hotel"
    #      }])
    #   building_age = current year - year_built; log_gfa_total = log10(square feet).
  values: |
    Column values (match these spellings exactly in WHERE clauses):
    - compliance_status: 'Compliant', 'Not Compliant' (nothing else).
    - primary_property_type (EPA names, ~70 total; common ones):
      'Multifamily Housing', 'Office', 'Non-Refrigerated Warehouse', 'K-12 School',
      'Hotel', 'Mixed Use Property', 'Retail Store', 'Worship Facility',
      'Supermarket/Grocery Store', 'Laboratory', 'Distribution Center',
      'Senior Living Community', 'Hospital (General Medical & Surgical)',
      'Medical Office', 'Self-Storage Facility', 'Residence Hall/Dormitory',
      'College/University', 'Data Center', 'Restaurant', 'Other'.
    - building_type (City class, coarser): 'NonResidential', 'Multifamily HR (10+)',
      'Multifamily MR (5-9)', 'Multifamily LR (1-4)', 'SPS-District K-12',
      'Campus', 'Nonresidential COS', 'Nonresidential WA'.
    - neighborhood: UPPERCASE — 'DOWNTOWN', 'EAST', 'LAKE UNION',
      'MAGNOLIA/QUEEN ANNE', 'GREATER DUWAMISH', 'BALLARD', 'NORTHEAST',
      'NORTHWEST', 'CENTRAL', 'SOUTHEAST', 'DELRIDGE', 'NORTH'.
    - council_district: integers 1-7 (nullable). data_year: 2015-2025.
    - city is almost always 'SEATTLE', state 'WA'.
  rules: |
    Source-specific:
    - buildings holds only static attributes; every per-year value — energy,
      emissions, compliance_status, demolished — is on energy_records. Join on
      ose_building_id.
    - Prefer weather-normalised EUI (site_eui_wn) for year-over-year comparisons,
      not raw site_eui.
    - Averaging ghg_emissions_intensity needs "IS NOT NULL" (nulls are ~40% some
      years) and usually a per-property-type cut (a warehouse and an office are
      not comparable).
    - energy_star_score is NULL by design for unscored types — filter it, never
      treat NULL as 0.
